name: Blast Radius Zero CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-unit:
    name: Validate & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --locked
      - name: Validate deployment scripts
        run: bash -n scripts/deploy-vultr.sh deploy/preflight.sh deploy/install-firewall.sh
      - name: Core application tests
        run: uv run --locked pytest core/tests -m 'not integration' --fail-on-skip -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  docker-containment:
    name: Python Docker Containment Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --locked
      - name: Report available disk space
        run: df -h .
      - name: Build core image from uv.lock
        run: |
          docker build -f core/Dockerfile -t brz-core:ci .
          docker run --rm --read-only brz-core:ci python -c "import brz.api, brz.worker, brz.form_service"
          docker run --rm --read-only brz-core:ci uvicorn --version
      - name: Build Python sandbox
        run: docker build -t brz-python-sandbox:local sandbox/python
      - name: Python Docker containment (BRZ_INTEGRATION=1)
        env:
          BRZ_INTEGRATION: '1'
        run: uv run --locked pytest core/tests -m 'integration and not browser_integration and not native_integration' --fail-on-skip -v
