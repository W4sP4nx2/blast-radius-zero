name: Blast Radius Zero CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-unit:
    name: Validate & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: core/requirements-dev.txt
      - run: pip install -r core/requirements-dev.txt
      - name: Core application tests
        run: PYTHONPATH=core python -m pytest core/tests -m 'not integration' --fail-on-skip -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web typecheck and build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  docker-containment:
    name: Python Docker Containment Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: core/requirements-dev.txt
      - run: pip install -r core/requirements-dev.txt
      - name: Report available disk space
        run: df -h .
      - name: Build Python sandbox
        run: docker build -t brz-python-sandbox:local sandbox/python
      - name: Python Docker containment (BRZ_INTEGRATION=1)
        env:
          PYTHONPATH: core
          BRZ_INTEGRATION: '1'
        run: python -m pytest core/tests -m 'integration and not browser_integration' --fail-on-skip -v
