name: containment-checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Backend application tests
        run: PYTHONPATH=backend pytest backend/tests -m 'not integration' -q
      - name: Build Python sandbox
        run: docker build -t brz-python-sandbox:local backend/python_sandbox
      - name: Python Docker containment (BRZ_INTEGRATION=1)
        run: PYTHONPATH=backend BRZ_INTEGRATION=1 pytest backend/tests -m integration -v -rs
        # Ephemeral Linux runner only. No production credentials or host access.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
